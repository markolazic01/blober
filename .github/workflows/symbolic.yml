name: Symbolic

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  halmos:
    name: Halmos proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Halmos
        run: pip install halmos==0.3.3

      - name: Prove (fails on any counterexample or timeout)
        run: make symbolic
